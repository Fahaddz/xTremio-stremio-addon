services:
  xtremio:
    container_name: xtremio

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3005:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # Large Xtream libraries can take longer than the default 15 seconds to
      # download. Metadata keeps the shorter timeout; catalog lists get more
      # time because an empty result is not useful to Stremio.
      UPSTREAM_CATEGORY_TIMEOUT_MS: 30000
      UPSTREAM_LIST_TIMEOUT_MS: 120000
      UPSTREAM_LIST_TTL_MS: 1200000
      # Refresh used full snapshots in the background so a week-old install
      # does not wait for a cold search request.
      UPSTREAM_BACKGROUND_REFRESH_MS: 7200000
      UPSTREAM_CATEGORY_REFRESH_MS: 21600000
      UPSTREAM_SERIES_INFO_REFRESH_MS: 21600000
      # Serialize large list downloads to prevent concurrent JSON payloads
      # from exhausting the Node heap when Stremio requests multiple catalogs.
      UPSTREAM_LIST_CONCURRENCY: 1
      # A cached search snapshot is always served immediately after idle time;
      # the next request refreshes it in the background.
      UPSTREAM_LIST_STALE_MS: infinite

      # Keep this low for a single-user/small deployment.
      # Increase only if you intentionally serve multiple accounts.
      CACHE_MAX_ACCOUNTS: 1
      CACHE_MAX_METADATA: 64

    restart: unless-stopped

    # Catalog responses can be large before they are compacted and cached.
    # The list semaphore keeps one large JSON payload active at a time.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 32M

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:3000/health >/dev/null || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    stop_signal: SIGTERM
    stop_grace_period: 5s
