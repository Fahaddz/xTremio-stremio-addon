services:
  xtremio:
    container_name: xtremio

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3005:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # Large Xtream libraries can take longer than the default 15 seconds to
      # download. Metadata keeps the shorter timeout; catalog lists get more
      # time because an empty result is not useful to Stremio.
      UPSTREAM_CATEGORY_TIMEOUT_MS: 30000
      UPSTREAM_LIST_TIMEOUT_MS: 90000

      # Keep this low for a single-user/small deployment.
      # Increase only if you intentionally serve multiple accounts.
      CACHE_MAX_ACCOUNTS: 2
      CACHE_MAX_METADATA: 128

    restart: unless-stopped

    # Catalog responses can be large before they are compacted and cached.
    # Keep enough headroom for one large response without making the service
    # needlessly large on small deployments.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 32M

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:3000/health >/dev/null || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    stop_signal: SIGTERM
    stop_grace_period: 5s
